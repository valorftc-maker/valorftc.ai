<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Valor FTC — Info (sign in)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0E141C; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
  .down {
    display: none; color: #8da0bb; font-family: ui-monospace, Menlo, monospace;
    font-size: 14px; padding: 48px 24px; text-align: center; line-height: 1.7;
  }
  .down a { color: #45D6BE; }
  .offline .down { display: block; }
  .offline iframe { display: none; }
</style>
</head>
<body>
<iframe id="info" title="Valor FTC — the firm, the record, the method (sign in with your desk account)"
        loading="eager" referrerpolicy="no-referrer"></iframe>
<div class="down">
  The firm write-up is served from the desk itself, behind the same sign-in as the live desk,
  and the desk is off the air right now. Check back shortly &mdash; this page retries on its own.<br><br>
  <a id="direct" href="https://valorpc.tail53cfa4.ts.net/info">Open it directly</a>
</div>
<script>
(function () {
  // Same door as /hj/: the page lives on the desk (behind its sign-in) and is
  // framed here; the section anchor (#record, #proof ...) rides along.
  var DESK = 'https://valorpc.tail53cfa4.ts.net/info';
  var url = DESK + (location.hash || '');
  var f = document.getElementById('info');
  var timer = null;
  document.getElementById('direct').href = url;
  f.src = url;
  fetch(DESK, { mode: 'no-cors', cache: 'no-store' }).then(function () {
    // reachable as a subresource: the frame path works
  }).catch(function () {
    // blocked (private-network embedding refused) or down: walk in the front door
    location.replace(url);
  });
  function armTimeout() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      document.body.className = 'offline';
      setTimeout(function () { f.src = url; armTimeout(); }, 20000);
    }, 15000);
  }
  f.addEventListener('load', function () {
    clearTimeout(timer);
    document.body.className = '';
  });
  window.addEventListener('hashchange', function () { url = DESK + (location.hash || ''); f.src = url; });
  armTimeout();
})();
</script>
</body>
</html>
