<style>
  html, body { margin: 0; height: 100%; background: #0E141C; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
  .down {
    display: none; color: #8598AC; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 14px; padding: 48px 24px; text-align: center; line-height: 1.7;
  }
  .down a { color: #45D6BE; }
  .offline .down { display: block; }
  .offline iframe { display: none; }
</style>
</head>
<body>
<iframe id="home" title="Valor FTC — sign in" loading="eager" referrerpolicy="no-referrer"></iframe>
<div class="down">
  Valor FTC's front door is served from the desk itself, behind a sign-in, and the desk is
  off the air right now. Check back shortly &mdash; this page retries on its own.<br><br>
  <a id="direct" href="https://valorpc.tail53cfa4.ts.net/home">Open it directly</a>
</div>
<script>
(function () {
  /* THE FRONT DOOR (owner, 2026-09-06): the home page is a sign-in. The page
     itself lives on the desk (/home, behind the same username + password as
     the live desk); this wrapper frames it, like /hj/ and /info/. Old deep
     links to sections of the write-up still forward to /info/. */
  var SECTIONS = ['hero', 'proof', 'record', 'survive', 'strategies', 'method', 'risk', 'seven-years', 'acquire'];
  var h = (location.hash || '').replace('#', '');
  if (h && SECTIONS.indexOf(h) >= 0) { location.replace('/info/#' + h); return; }
  var DESK = 'https://valorpc.tail53cfa4.ts.net/home';
  var f = document.getElementById('home');
  var timer = null;
  f.src = DESK;
  fetch(DESK, { mode: 'no-cors', cache: 'no-store' }).then(function () {
    // reachable as a subresource: the frame path works
  }).catch(function () {
    // blocked (private-network embedding refused) or down: walk in the front door
    location.replace(DESK);
  });
  function armTimeout() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      document.body.className = 'offline';
      setTimeout(function () { f.src = DESK; armTimeout(); }, 20000);
    }, 15000);
  }
  f.addEventListener('load', function () { clearTimeout(timer); document.body.className = ''; });
  armTimeout();
})();
</script>
</body>
</html>
