<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Valor — The Hybrid Tower, live</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0f1a; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
  .down {
    display: none; color: #8da0bb; font-family: ui-monospace, Menlo, monospace;
    font-size: 14px; padding: 48px 24px; text-align: center; line-height: 1.7;
  }
  .offline .down { display: block; }
  .offline iframe { display: none; }
</style>
</head>
<body>
<iframe id="desk" src="https://valorpc.tail53cfa4.ts.net/"
        title="Hybrid Investment Firm — live desk (view only)"
        loading="eager" referrerpolicy="no-referrer"></iframe>
<div class="down">
  The live desk is off the air right now.<br>
  The broadcast streams straight from the firm's own machine &mdash; check back shortly &mdash;
  this page retries on its own.
</div>
<script>
  // Judge liveness by the embed itself. A separate health fetch gets eaten by
  // ad-blockers (ERR_BLOCKED_BY_CLIENT) and falsely reported an outage: the
  // iframe is the broadcast, so the iframe is also the test. While marked
  // offline, the page quietly retries every 20 seconds and recovers itself.
  (function () {
    var f = document.getElementById('desk');
    var timer = null;
    function armTimeout() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        document.body.className = 'offline';
        setTimeout(function () { f.src = f.src; armTimeout(); }, 20000);
      }, 15000);
    }
    f.addEventListener('load', function () {
      clearTimeout(timer);
      document.body.className = '';
    });
    armTimeout();
  })();
</script>
</body>
</html>
