<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Valor — The Hybrid Tower, live</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0f1a; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
  .down {
    display: none; color: #8da0bb; font-family: ui-monospace, Menlo, monospace;
    font-size: 14px; padding: 48px 24px; text-align: center; line-height: 1.7;
  }
  .down a { color: #5aa9e6; }
  .offline .down { display: block; }
  .offline iframe { display: none; }
</style>
</head>
<body>
<iframe id="desk" src="https://valorpc.tail53cfa4.ts.net/"
        title="Hybrid Investment Firm — the Tower, live, view only (sign in with your desk account)"
        loading="eager" referrerpolicy="no-referrer"></iframe>
<div class="down">
  The live desk is off the air right now.<br>
  The broadcast streams straight from the firm's own machine &mdash; check back shortly &mdash;
  this page retries on its own. When it is up you sign in with your desk account and see
  the Tower exactly as the desk shows it, view only.<br><br>
  <a href="https://valorpc.tail53cfa4.ts.net/">Open the live desk directly</a>
</div>
<script>
(function () {
  var DESK = 'https://valorpc.tail53cfa4.ts.net/';
  var f = document.getElementById('desk');
  var timer = null;

  // Devices carrying the firm's own VPN resolve the desk to a private address,
  // and Chrome's Local Network Access rules refuse to EMBED a private-network
  // page inside a public one - the iframe stays blank forever while a plain
  // navigation to the same URL is allowed. The probe below fails in
  // milliseconds on exactly those devices (and only stalls when the desk is
  // truly down), so: probe first; if embedding is impossible, walk through the
  // front door instead of framing it.
  fetch(DESK, { mode: 'no-cors', cache: 'no-store' }).then(function () {
    // reachable as a subresource: the iframe path works - let it run
  }).catch(function () {
    // blocked or down; a top-level hop answers both better than a white box
    location.replace(DESK);
  });

  /* THE 15-SECOND RACE IS OVER (owner, 2026-09-09: "on my iphone it just
     keeps resetting at or after the systems check"). This timer used to reset
     the iframe after 15s, then every 20s - but the tower is a multi-megabyte
     page, and on a phone over cellular through the funnel it simply cannot
     finish in 15 seconds. The reset killed it mid-systems-check, re-armed,
     and killed it again: the loop WAS this wrapper. Now: 90 seconds before
     the first retry, each retry backs off (90s -> 3m -> 6m, capped), and any
     sign of life from the desk - the frame's load event OR its first
     postMessage (the tab-title bridge fires long before a slow load event) -
     stands the timer down for good. */
  var alive = false, waitMs = 90000;
  function armTimeout() {
    clearTimeout(timer);
    if (alive) return;
    timer = setTimeout(function () {
      if (alive) return;
      document.body.className = 'offline';
      setTimeout(function () {
        if (alive) return;
        f.src = f.src;
        waitMs = Math.min(waitMs * 2, 360000);
        armTimeout();
      }, 20000);
    }, waitMs);
  }
  function deskIsAlive() {
    alive = true;
    clearTimeout(timer);
    document.body.className = '';
  }
  // THE NUMBER IN THE TAB (owner, 2026-09-06). The Tower runs cross-origin in
  // the iframe below, so it cannot write this page's title; it posts its
  // all-time P/L up instead and this page writes its own tab. Only messages
  // from the desk's own origin are believed.
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://valorpc.tail53cfa4.ts.net') return;
    deskIsAlive();                       // a message IS proof of life
    var d = e.data;
    if (!d || d.tht !== 'pl' || typeof d.text !== 'string') return;
    if (d.text.length > 24) return;
    document.title = d.text + ' \u00b7 Valor \u2014 The Hybrid Tower, live';
  }, false);

  f.addEventListener('load', function () { deskIsAlive(); });
  armTimeout();
})();
</script>
</body>
</html>
