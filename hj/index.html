<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Valor — The Hybrid Tower, live</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0f1a; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
  .down {
    display: none; color: #8da0bb; font-family: ui-monospace, Menlo, monospace;
    font-size: 14px; padding: 48px 24px; text-align: center; line-height: 1.7;
  }
  .offline .down { display: block; }
  .offline iframe { display: none; }
</style>
</head>
<body>
<iframe id="desk" src="https://valorpc.tail53cfa4.ts.net/"
        title="Hybrid Investment Firm — live desk (view only)"
        loading="eager" referrerpolicy="no-referrer"></iframe>
<div class="down">
  The live desk is off the air right now.<br>
  The broadcast streams straight from the firm's own machine &mdash; check back shortly.
</div>
<script>
  // If the desk is unreachable, say so instead of showing an empty frame.
  // no-cors: an opaque success means reachable; only a network failure rejects.
  fetch('https://valorpc.tail53cfa4.ts.net/api/health', { mode: 'no-cors' })
    .catch(function () { document.body.className = 'offline'; });
</script>
</body>
</html>
